<!doctype html>
<html lang="zh-CN">
<head>
  <!-- Cloudflare Web Analytics -->
  <script defer src='https://static.cloudflareinsights.com/beacon.min.js' data-cf-beacon='{"token": "e5386f6b4daa409f8451babd2b0c325f"}'></script>
  <!-- End Cloudflare Web Analytics -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>Hudson讲故事</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="favicon.png">
  <meta name="theme-color" content="#ffffff">
  <style>
    :root{
      --bg:#fff;--card:#f6f7f9;--fg:#111;--muted:#6b7280;--pri:#0b6cff;--line:#e5e7eb;
      --shadow: 0 8px 24px rgba(17,24,39,.08);
    }
    *{box-sizing:border-box}
    html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Noto Sans CJK SC","Microsoft Yahei",Arial,sans-serif}
    .app{display:flex;flex-direction:column;height:100%}
    .topbar{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid var(--line);
      padding:12px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
    .title{font-size:16px;font-weight:700;white-space:nowrap}
    .hint{font-size:12px;color:var(--muted);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:62vw}

    .list{flex:1;overflow:auto;padding:12px 12px 160px;background:var(--card)}

    .empty{color:var(--muted);font-size:14px;text-align:center;padding:28px}

    /* Album grid */
    /* Album list (mobile-first) */
    .albumGrid{
      display:flex;
      flex-direction:column;
      gap:12px;
    }

    /* 专辑卡片撑满一行 */
    .albumCard{
      width:100%;
    }

    /* 可选：让封面稍大一点，手机上更好点按 */
    .cover{width:56px;height:56px;flex:0 0 56px}
    @media (min-width:720px){ .albumGrid{grid-template-columns:repeat(3, minmax(0,1fr));} }

    .albumCard{
      background:#fff;border:1px solid var(--line);border-radius:16px;
      padding:12px;display:flex;flex-direction:column;gap:10px;
      box-shadow: var(--shadow);
      cursor:pointer;
      user-select:none;
      transition:transform .06s ease, box-shadow .06s ease;
    }
    .albumCard:active{transform:scale(.99)}
    .albumTop{display:flex;align-items:center;gap:10px}
    .cover{width:52px;height:52px;border-radius:12px;flex:0 0 52px;
      background:linear-gradient(45deg,#a0c4ff,#bdb2ff);overflow:hidden}
    .cover img{width:100%;height:100%;object-fit:cover;display:block}
    .albumMeta{min-width:0;flex:1}
    .albumName{font-size:15px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .albumInfo{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    .pillRow{display:flex;gap:8px;flex-wrap:wrap}
    .pill{font-size:12px;color:#1f2937;background:#f3f4f6;border:1px solid var(--line);border-radius:999px;padding:6px 10px}
    .pill.pri{background:#eef3ff;border-color:#bfd3ff;color:#1d4ed8}

    /* Expanded album panel */
    .albumPanel{
      margin-top:10px;
      border-top:1px dashed var(--line);
      padding-top:10px;
      display:none;
    }
    .albumCard.expanded .albumPanel{display:block}
    .trackList{display:flex;flex-direction:column;gap:8px}

    .track{
      display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;
      background:#fff;border:1px solid var(--line);cursor:pointer;
    }
    .art{width:44px;height:44px;border-radius:10px;background:linear-gradient(45deg,#a0c4ff,#bdb2ff);overflow:hidden;flex:0 0 44px}
    .art img{width:100%;height:100%;object-fit:cover;display:block}
    .twrap{flex:1;min-width:0}
    .t1{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .t2{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .active{outline:2px solid #bfd3ff;background:#f0f6ff}

    /* Controls */
    .controls{position:sticky;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);
      padding:10px 12px 14px;display:flex;flex-direction:column;gap:10px}
    .now{display:flex;align-items:center;gap:10px}
    .now .art{width:52px;height:52px}
    .meta{min-width:0}.meta .t1{font-size:16px}
    .row{display:flex;align-items:center;gap:10px}
    .time{font-variant-numeric:tabular-nums;min-width:44px;text-align:center;color:var(--muted);font-size:12px}
    input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:6px;border-radius:999px;background:#e5e7eb;outline:none}
    input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;
      background:#0b6cff;border:2px solid #fff;box-shadow:0 0 0 2px rgba(11,108,255,.25)}
    .bar{display:flex;align-items:center;gap:10px;justify-content:center;flex-wrap:wrap}
    .cbtn{min-width:62px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:18px;padding:0 14px}
    .cbtn.main{min-width:120px;font-size:18px;background:var(--pri);color:#fff;border-color:var(--pri)}
    .tog{font-size:13px;border-radius:999px;border:1px solid var(--line);padding:6px 10px;background:#fff}
    .tog.active{background:#eef3ff;border-color:#bfd3ff}

    /* small helper */
    .rightHint{margin-left:auto;font-size:12px;color:var(--muted)}
  </style>
</head>

<body>
<div class="app">
  <header class="topbar">
    <div class="title">Hudson胡萝卜🥕讲故事</div>
    <div class="hint">我宝今年3岁半了，这里收录了他喜欢的故事（2026）</div>
  </header>

  <section class="list" id="list">
    <div class="empty">加载中...</div>
  </section>

  <footer class="controls">
    <div class="now">
      <div class="art" id="nowCover"></div>
      <div class="meta">
        <div class="t1" id="nowTitle">未选择</div>
        <div class="t2" id="nowSub">—</div>
      </div>
    </div>

    <div class="row">
      <span class="time" id="cur">00:00</span>
      <input type="range" id="seek" min="0" max="100" value="0" step="0.1" aria-label="进度条">
      <span class="time" id="dur">00:00</span>
    </div>

    <div class="bar">
      <button class="cbtn" id="prev" aria-label="上一曲">⏮</button>
      <button class="cbtn main" id="play" aria-label="播放/暂停">▶️ 播放</button>
      <button class="cbtn" id="next" aria-label="下一曲">⏭</button>
    </div>
    <div class="bar">
      <button class="tog" id="loop" aria-label="循环">循环</button>
      <button class="tog" id="shuffle" aria-label="随机">随机</button>
    </div>
  </footer>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
const $ = sel => document.querySelector(sel);
const listEl = $("#list");
const audioEl = $("#audio");
const nowTitle=$("#nowTitle");
const nowSub  =$("#nowSub");
const nowCover=$("#nowCover");
const playBtn = $("#play");
const prevBtn = $("#prev");
const nextBtn = $("#next");
const loopBtn = $("#loop");
const shufBtn = $("#shuffle");
const seekEl  = $("#seek");
const curEl   = $("#cur");
const durEl   = $("#dur");

let tracks = []; // [{title, artist, album, url, cover, file}]
let idx = -1;
let seeking = false;
let isLoop = false;
let isShuffle = false;

// album -> { name, idxes:[], cover, count }
let albumOrder = [];
let albumMap = new Map();
let expandedAlbum = ""; // only expand one at a time

function s2t(sec){
  if(!isFinite(sec)) return "00:00";
  const s=Math.floor(sec%60).toString().padStart(2,"0");
  const m=Math.floor(sec/60).toString().padStart(2,"0");
  return `${m}:${s}`;
}
function titleFromName(name){
  try{name=decodeURIComponent(name);}catch{}
  return name.replace(/\.(mp3|m4a|aac|wav|ogg|flac)$/i,"");
}

function normalizeItems(items=[]){
  return items.map((x,i)=>{
    const file = (x.file||"").trim();
    const url  = (x.url||"").trim() || (file ? `/audio/${encodeURIComponent(file)}` : "");
    return {
      title: x.title?.trim() || (file ? titleFromName(file) : `Track ${i+1}`),
      artist: x.artist?.trim() || "",
      album: x.album?.trim() || "",
      cover: x.cover?.trim() || "",
      url, file
    };
  }).filter(t=>!!t.url);
}

function buildAlbums(){
  albumMap = new Map();
  tracks.forEach((t,i)=>{
    const key = t.album || "未分专辑";
    if (!albumMap.has(key)){
      albumMap.set(key, { name:key, idxes:[], cover:"", count:0 });
    }
    const a = albumMap.get(key);
    a.idxes.push(i);
    a.count++;
    // pick first available cover as album cover
    if (!a.cover && t.cover) a.cover = t.cover;
  });
  albumOrder = Array.from(albumMap.values()).sort((a,b)=>{
    // keep “未分专辑” last
    if (a.name==="未分专辑" && b.name!=="未分专辑") return 1;
    if (b.name==="未分专辑" && a.name!=="未分专辑") return -1;
    return a.name.localeCompare(b.name, "zh-Hans-CN-u-co-pinyin");
  });
  if (!expandedAlbum && albumOrder.length) expandedAlbum = albumOrder[0].name;
}

function render(){
  listEl.innerHTML = "";
  if (!tracks.length){
    listEl.innerHTML = '<div class="empty">没有找到音频。请检查 /audio/stories.json 或 /audio/index.txt</div>';
    return;
  }

  const wrap = document.createElement("div");
  wrap.className = "albumGrid";

  albumOrder.forEach(a=>{
    const card = document.createElement("div");
    card.className = "albumCard" + (a.name===expandedAlbum ? " expanded" : "");
    card.setAttribute("data-album", a.name);

    const firstIdx = a.idxes[0];
    const firstTrack = tracks[firstIdx];

    card.innerHTML = `
      <div class="albumTop">
        <div class="cover">${a.cover ? `<img src="${a.cover}" alt="">` : ""}</div>
        <div class="albumMeta">
          <div class="albumName" title="${escapeHtml(a.name)}">${escapeHtml(a.name)}</div>
          <div class="albumInfo">${a.count} 个音频${firstTrack?.artist ? " · " + escapeHtml(firstTrack.artist) : ""}</div>
        </div>
      </div>
      <div class="pillRow">
        <span class="pill pri">${a.name===expandedAlbum ? "已展开" : "点击展开"}</span>
        <span class="pill">${idx>=0 && a.idxes.includes(idx) ? "正在播放此专辑" : "—"}</span>
      </div>
      <div class="albumPanel">
        <div class="trackList"></div>
      </div>
    `;

    // Build track list only when expanded (performance + cleaner)
    if (a.name === expandedAlbum){
      const trackList = card.querySelector(".trackList");
      a.idxes.forEach(i=>{
        const t = tracks[i];
        const row = document.createElement("div");
        row.className = "track" + (i===idx ? " active" : "");
        row.innerHTML = `
          <div class="art">${t.cover ? `<img src="${t.cover}" alt="">` : ""}</div>
          <div class="twrap">
            <div class="t1">${escapeHtml(t.title)}</div>
            <div class="t2">${escapeHtml(t.artist || t.file || t.url)}</div>
          </div>
        `;
        row.addEventListener("click", (ev)=>{
          ev.stopPropagation();
          load(i, true);
          // keep album expanded
        });
        trackList.appendChild(row);
      });
    }

    card.addEventListener("click", ()=>{
      const name = card.getAttribute("data-album") || "";
      expandedAlbum = (expandedAlbum === name) ? "" : name; // toggle collapse
      render();
    });

    wrap.appendChild(card);
  });

  listEl.appendChild(wrap);
}

// minimal HTML escaping for safety
function escapeHtml(str){
  return String(str ?? "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#39;");
}

function load(i, autoplay=false){
  if (i<0 || i>=tracks.length) return;
  idx = i;
  const t = tracks[i];
  audioEl.src = t.url;
  nowTitle.textContent = t.title;
  nowSub.textContent   = t.artist || t.album || (t.file || t.url);
  nowCover.innerHTML   = t.cover ? `<img src="${t.cover}" alt="">` : "";

  // ensure the album of current track expanded (optional but practical)
  const aName = t.album || "未分专辑";
  if (expandedAlbum !== aName){
    expandedAlbum = aName;
    render();
  } else {
    // update active state inside expanded list
    document.querySelectorAll(".track").forEach(el=>el.classList.remove("active"));
    // re-render is simpler, but avoid unnecessary full repaint here
    const albumCard = document.querySelector(`.albumCard[data-album="${cssEscape(aName)}"]`);
    if (albumCard && albumCard.classList.contains("expanded")){
      const rows = albumCard.querySelectorAll(".track");
      // rows correspond to album idxes order
      const a = albumMap.get(aName);
      if (a){
        const pos = a.idxes.indexOf(i);
        if (pos>=0 && rows[pos]) rows[pos].classList.add("active");
      }
    }
  }

  if (autoplay) play();
}

function cssEscape(s){
  // basic CSS attr selector escape for quotes/backslashes
  return String(s).replaceAll("\\","\\\\").replaceAll('"','\\"');
}

function play(){
  audioEl.play().then(()=>{ playBtn.textContent="⏸ 暂停"; }).catch(()=>{});
}
function pause(){
  audioEl.pause();
  playBtn.textContent="▶️ 播放";
}

function next(){
  if (!tracks.length) return;
  if (isShuffle && tracks.length>1){
    let j = Math.floor(Math.random()*tracks.length);
    if (j===idx) j = (j+1)%tracks.length;
    load(j, true);
  } else {
    load((idx+1)%tracks.length, true);
  }
}
function prev(){
  if (!tracks.length) return;
  load((idx-1+tracks.length)%tracks.length, true);
}

playBtn.addEventListener("click", ()=> audioEl.paused?play():pause());
nextBtn.addEventListener("click", next);
prevBtn.addEventListener("click", prev);
audioEl.addEventListener("ended", ()=>{ if (isLoop) load(idx, true); else next(); });

// Seek bar
audioEl.addEventListener("timeupdate", ()=>{
  if (seeking) return;
  seekEl.value = ((audioEl.currentTime/(audioEl.duration||1))*100)||0;
  curEl.textContent = s2t(audioEl.currentTime);
  durEl.textContent = s2t(audioEl.duration);
});
seekEl.addEventListener("input", ()=> seeking=true);
seekEl.addEventListener("change", ()=>{
  const pct = parseFloat(seekEl.value||"0")/100;
  audioEl.currentTime = (audioEl.duration||0)*pct;
  seeking=false;
});

// Loop & Shuffle buttons
loopBtn.addEventListener("click", ()=>{ isLoop = !isLoop; loopBtn.classList.toggle("active", isLoop); });
shufBtn.addEventListener("click", ()=>{ isShuffle = !isShuffle; shufBtn.classList.toggle("active", isShuffle); });

// ---------- 数据源：stories.json → index.txt → 探测命名 ----------
async function loadFromStoriesJson(){
  const res = await fetch("/audio/stories.json", { cache:"no-store" });
  if (!res.ok) throw new Error("no stories.json");
  const data = await res.json();
  if (!Array.isArray(data?.tracks)) throw new Error("invalid stories.json");
  return normalizeItems(data.tracks);
}
async function loadFromIndexTxt(){
  const res = await fetch("/audio/index.txt", { cache:"no-store" });
  if (!res.ok) throw new Error("no index.txt");
  const lines = (await res.text()).split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  const exts = /\.(mp3|m4a|aac|wav|ogg|flac)$/i;
  return normalizeItems(lines.filter(n=>exts.test(n)).map(n=>({ file:n, album:"未分专辑" })));
}
async function probeCommon(){
  const candidates = [];
  for (let i=1;i<=200;i++) candidates.push(`${i}.mp3`);
  for (let i=1;i<=200;i++) candidates.push(`${String(i).padStart(3,"0")}.mp3`);
  for (let i=1;i<=200;i++) candidates.push(`track-${String(i).padStart(3,"0")}.mp3`);
  for (let i=1;i<=200;i++) candidates.push(`story-${String(i).padStart(3,"0")}.mp3`);
  const exist = [];
  const batch = 20;
  for (let p=0;p<candidates.length;p+=batch){
    const part = candidates.slice(p,p+batch);
    await Promise.all(part.map(async name=>{
      try{
        const r = await fetch(`/audio/${encodeURIComponent(name)}`, { method:"HEAD", cache:"no-store" });
        if (r.ok) exist.push({ title:titleFromName(name), file:name, url:`/audio/${encodeURIComponent(name)}`, album:"未分专辑" });
      }catch{}
    }));
    if (exist.length>=1) break;
  }
  return exist;
}

(async function init(){
  try { tracks = await loadFromStoriesJson(); }
  catch(e1){
    try { tracks = await loadFromIndexTxt(); }
    catch(e2){
      try { tracks = await probeCommon(); }
      catch(e3){ tracks = []; }
    }
  }

  if (!tracks.length){
    render();
    return;
  }

  buildAlbums();
  render();
  load(0, false);
})();
</script>
</body>
</html>
